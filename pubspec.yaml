name: vyper_control
description: "Vyper Control - Remote Device Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  device_info_plus: ^9.1.1
  image_picker: ^1.0.5
  path_provider: ^2.1.1
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    
  fonts:
    - family: Genetic
      fonts:
        - asset: fonts/Genetic.ttf
    - family: Ready
      fonts:
        - asset: fonts/Ready.ttf
    - family: Bungee
      fonts:
        - asset: fonts/Bungee.ttf